[project]
name = "opsrag"
version = "0.1.0"
description = "Local RAG assistant for DevOps documentation (Kubernetes, Prometheus, Helm) powered by Ollama and pgvector"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "numpy>=2.0",
    "onnxruntime>=1.20",
    "pgvector>=0.3",
    "prometheus-client>=0.21",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "tokenizers>=0.20",
    "typer>=0.15",
    "uvicorn>=0.32",
]

[project.scripts]
opsrag = "opsrag.cli:run"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
