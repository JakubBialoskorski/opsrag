name: docs-update

# Every Friday: bump the docs to their newest versions, run all CI checks on the result and open
# a pull request. Approving it is the only manual step, it then merges itself (automerge.yml).
# Needs "Allow GitHub Actions to create and approve pull requests" in the repo settings.
on:
  schedule:
    - cron: "0 6 * * 5"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

env:
  BRANCH: auto/docs-update

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.update.outputs.changed }}
      summary: ${{ steps.update.outputs.summary }}
      sha: ${{ steps.update.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - id: update
        name: Resolve newest docs versions
        run: |
          summary="$(uv run opsrag update)"
          echo "$summary"
          if git diff --quiet sources.lock.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          { echo "changed=true"; echo "summary<<EOF"; echo "$summary"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -am "update documentation sources"
          git push --force origin "$BRANCH"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # The same checks as for any pull request, on this exact commit. Branch protection requires the
  # "tests" check, which the pull-request job reports for this commit.
  ci:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/ci.yml
    # Asked for by its image and release jobs, which neither push nor release from here
    permissions:
      contents: write
      packages: write
    with:
      ref: ${{ needs.update.outputs.sha }}
      check-links: true

  pull-request:
    needs: [update, ci]
    if: always() && needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        env:
          SUMMARY: ${{ needs.update.outputs.summary }}
          SHA: ${{ needs.update.outputs.sha }}
          RESULT: ${{ needs.ci.result }}
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const passed = process.env.RESULT === "success";
            // A failure also blocks a pull request left open from an earlier run, now on this commit
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: process.env.SHA, context: "tests", target_url: run,
              state: passed ? "success" : "failure",
              description: passed ? "CI checks passed" : "CI checks failed",
            });
            if (!passed) return;
            const body = [
              "Newer versions of the documentation are available:",
              "",
              "```", process.env.SUMMARY, "```",
              "",
              `All CI checks, including the link check, passed on this commit: ${run}`,
              "Approve it to update the index, it then merges itself and the image is rebuilt on main.",
            ].join("\n");
            const head = process.env.BRANCH;
            const { data: repo } = await github.rest.repos.get(context.repo);
            const { data: open } = await github.rest.pulls.list({
              ...context.repo, head: `${context.repo.owner}:${head}`, state: "open",
            });
            if (open.length) {
              await github.rest.pulls.update({ ...context.repo, pull_number: open[0].number, body });
            } else {
              await github.rest.pulls.create({
                ...context.repo, head, base: repo.default_branch, title: "Update documentation", body,
              });
            }

  # GitHub disables scheduled workflows in public repos after 60 days without activity.
  # Re-enabling them on every run resets that timer, without dummy commits.
  keepalive:
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            for (const workflow_id of ["docs-update.yml", "models-update.yml"]) {
              await github.rest.actions.enableWorkflow({ ...context.repo, workflow_id });
            }
