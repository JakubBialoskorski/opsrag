name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  # The weekly update workflows call this workflow on their commit and report the result on their
  # pull request. Opened with GITHUB_TOKEN, it would get a run here that waits for an approval.
  pull_request:
    paths-ignore: [sources.lock.yaml, models.lock.yaml]
  # The main branch again, after an update pull request was merged (see automerge.yml)
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to check, the image is then only built
        type: string
        required: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: node --test tests/*.test.mjs
      - run: bash -n start.sh && bash -n stop.sh
      # Workflows read the Ollama image from docker-compose.yml, where it's pinned by tag and digest
      - name: Ollama image pinned in one place
        run: |
          docker compose --profile ollama config --images ollama \
            | grep -Eq '^ollama/ollama:[0-9.]+@sha256:[0-9a-f]{64}$'
          ! grep -rn 'ollama/ollama:[0-9]' .github start.sh

  quality:
    needs: lint-test
    uses: ./.github/workflows/quality.yml
    with:
      ref: ${{ inputs.ref }}

  # Links depend on the live docs sites, not on our code, so a page moved upstream must not block
  # a release, only merging. A failure here is fixed by merging the weekly docs-update pull request.
  links:
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run opsrag check-links

  # Multi-arch image (amd64 + arm64), pushed to GHCR from main and version tags, only built for
  # pull requests and the commits checked by the update workflows
  image:
    needs: [lint-test, quality]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/opsrag
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha
      - if: github.event_name != 'pull_request' && !inputs.ref
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && !inputs.ref }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The one check branch protection requires before a pull request can be merged
  tests:
    needs: [lint-test, quality, links, image]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  # A version tag gets a GitHub release once its image is published, notes list the merged PRs
  release:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const tag = context.ref.replace("refs/tags/", "");
            const version = tag.replace(/^v/, "");
            const image = `ghcr.io/${context.repo.owner.toLowerCase()}/opsrag:${version}`;
            await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: tag,
              prerelease: version.includes("-"),
              generate_release_notes: true,
              body: [
                `Image: \`${image}\``,
                "",
                "To go back to this release with its docs and models (the lock files come from the clone):",
                `\`git checkout ${tag}\`, set \`OPSRAG_VERSION=${version}\` in .env, then run ./start.sh.`,
                "",
              ].join("\n"),
            });
