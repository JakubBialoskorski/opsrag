name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: node --test tests/*.test.mjs
      - run: bash -n start.sh && bash -n stop.sh
      # Workflows read the Ollama image from docker-compose.yml, where it's pinned by tag and digest
      - name: Ollama image pinned in one place
        run: |
          docker compose --profile ollama config --images ollama \
            | grep -Eq '^ollama/ollama:[0-9.]+@sha256:[0-9a-f]{64}$'
          ! grep -rn 'ollama/ollama:[0-9]' .github start.sh

  quality:
    needs: lint-test
    uses: ./.github/workflows/quality.yml

  # Links depend on the live docs sites, not on our code, so a page moved upstream must not block
  # a release. A failure here is fixed by merging the weekly docs-update pull request.
  links:
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run opsrag check-links

  # Multi-arch image (amd64 + arm64), pushed to GHCR from main and version tags
  image:
    needs: [lint-test, quality]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/opsrag
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
