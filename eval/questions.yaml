# Each question lists documents ("source:path") that contain the answer.
# Retrieval counts as a hit if any of them shows up in the top results.
# Questions with no expected documents are out of scope: the assistant should refuse them.
# must_include: syntax a correct answer has to contain. known_issue: reported, not failing.

